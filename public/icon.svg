<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="tabGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0077ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep dark base rounded plate -->
  <rect width="32" height="32" rx="7" fill="#040810"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Center radar glow -->
  <circle cx="16" cy="16" r="10" fill="url(#tabGlow)"/>

  <!-- Tactical Reticle Rings -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 1.5"/>
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="#00f0ff" stroke-width="1"/>

  <!-- Crosshair axes -->
  <line x1="16" y1="2" x2="16" y2="9" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="30" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="9" y2="16" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="30" y2="16" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Target Locked Center Core -->
  <circle cx="16" cy="16" r="2.5" fill="#ffaa00"/>
  <circle cx="16" cy="16" r="1" fill="#ffffff"/>

  <!-- 4 Corner Sensor Dots -->
  <circle cx="5" cy="5" r="1" fill="#00ff88"/>
  <circle cx="27" cy="5" r="1" fill="#00ff88"/>
  <circle cx="5" cy="27" r="1" fill="#00ff88"/>
  <circle cx="27" cy="27" r="1" fill="#00ff88"/>
</svg>
